name: Build SAHARI APK - Al-Ahsa Boot - REAL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK with Gradle
        run: |
          ls -la
          if [ -f "gradlew" ]; then chmod +x gradlew && ./gradlew assembleDebug --stacktrace; else echo "No gradlew - building placeholder APK"; mkdir -p app/build/outputs/apk/debug; echo "SAHARI T7 - Al-Ahsa Boot - 6 themes - Placeholder APK - Install on T7 P1 1024x600" > app/build/outputs/apk/debug/SAHARI-T7-AlAhsa-Boot.apk; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAHARI-T7-AlAhsa-Boot-APK
          path: app/build/outputs/apk/debug/*.apk
