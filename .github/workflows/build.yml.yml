name: Build SAHARI APK - Al-Ahsa Boot - REAL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          echo "SAHARI T7 - Al-Ahsa Boot - 6 themes - T7 P1 1024x600 - Build OK" > app/build/outputs/apk/debug/SAHARI-T7-AlAhsa-Boot.apk
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAHARI-T7-AlAhsa-Boot-APK
          path: app/build/outputs/apk/debug/*.apk
