name: Build SAHARI APK - Al-Ahsa Boot
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: mkdir -p dist && echo "SAHARI Builder - Al-Ahsa Boot - 6 themes" > dist/SAHARI-T7-AlAhsa-Boot.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SAHARI-T7-AlAhsa-Boot
          path: dist/