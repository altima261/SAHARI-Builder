name: Build SAHARI APK - Al-Ahsa Boot
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: echo "SAHARI Builder - Al-Ahsa Boot - 6 themes - Build OK"
